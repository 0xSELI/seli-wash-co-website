<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">SELI Wash Co. logo</title>
  <desc id="desc">A circular navy, amber, pale blue, and white badge showing a dirty surface becoming clean.</desc>
  <defs>
    <clipPath id="badge-clip">
      <circle cx="500" cy="500" r="442" />
    </clipPath>
  </defs>

  <circle cx="500" cy="500" r="468" fill="#FFFFFF" stroke="#0B1826" stroke-width="32" />

  <g clip-path="url(#badge-clip)">
    <rect x="58" y="58" width="884" height="884" fill="#FFFFFF" />

    <g font-family="Bahnschrift, 'Arial Narrow', Arial, sans-serif" text-anchor="middle">
      <text x="500" y="272" fill="#0B1826" font-size="174" font-weight="800" letter-spacing="10">SELI</text>
      <text x="500" y="382" fill="#EF9B3E" font-size="90" font-weight="800" letter-spacing="9">WASH CO.</text>
    </g>

    <rect x="58" y="432" width="884" height="302" fill="#BFE6F2" />

    <!-- The navy field is grime; its ragged edge is the active wash front. -->
    <path fill="#0B1826" d="M58 432H522l28 24-24 30 29 27-31 29 24 28-30 27 22 32-36 25 20 30-29 40H58Z" />

    <!-- Grime particles break away toward the wash front. -->
    <g fill="#FFFFFF" opacity="0.94">
      <circle cx="448" cy="483" r="8" />
      <circle cx="480" cy="507" r="5" />
      <circle cx="454" cy="548" r="6" />
      <circle cx="491" cy="576" r="9" />
      <circle cx="454" cy="624" r="5" />
      <circle cx="480" cy="670" r="7" />
    </g>
    <g fill="#BFE6F2">
      <circle cx="397" cy="470" r="12" />
      <circle cx="425" cy="526" r="8" />
      <circle cx="386" cy="572" r="6" />
      <circle cx="429" cy="607" r="11" />
      <circle cx="398" cy="660" r="8" />
      <circle cx="447" cy="693" r="5" />
    </g>

    <!-- Clean-surface sparkles make the transformation unmistakable. -->
    <g fill="#FFFFFF">
      <path d="M681 486l10 25 25 10-25 10-10 25-10-25-25-10 25-10Z" />
      <path d="M793 592l7 18 18 7-18 7-7 18-7-18-18-7 18-7Z" />
      <path d="M633 645l7 17 17 7-17 7-7 17-7-17-17-7 17-7Z" />
      <circle cx="761" cy="478" r="8" />
      <circle cx="856" cy="535" r="6" />
      <circle cx="724" cy="685" r="6" />
    </g>

    <rect x="58" y="734" width="884" height="208" fill="#FFFFFF" />
    <rect x="188" y="734" width="624" height="12" rx="6" fill="#EF9B3E" />
    <g fill="#0B1826" font-family="Bahnschrift, 'Arial Narrow', Arial, sans-serif" text-anchor="middle">
      <text x="500" y="838" font-size="61" font-weight="800" textLength="660" lengthAdjust="spacingAndGlyphs">PRESSURE WASHING</text>
      <text x="500" y="900" font-size="35" font-weight="700" letter-spacing="8">DUNCAN, OK</text>
    </g>
  </g>
</svg>
